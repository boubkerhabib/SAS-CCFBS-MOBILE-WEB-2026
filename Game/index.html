<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="title">
            <h1>HELLO IN GAME</h1>
        </div>

        <div class="buttons">
            <button id="paper">Paper</button>
            <button id="ciseaux">Scissors</button>
            <button id="pierre">Rock</button>
        </div>

        <div class="choices">
            <p>Player Choice: <span id="playerChoice">-</span></p>
            <p>Computer Choice: <span id="computerChoice">-</span></p>
        </div>

        <div class="result">
            <h2 id="result">Result will appear here</h2>
        </div>

        <div class="scoreboard">
            <p>Player Wins: <span id="playerScore">0</span></p>
            <p>Computer Wins: <span id="computerScore">0</span></p>
            <p>Draws: <span id="drawScore">0</span></p>
        </div>

        <div class="reset">
            <button id="reset">Reset Game</button>
        </div>

    </div>

<script src="script.js"></script>

</body>
</html>
